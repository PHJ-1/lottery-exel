<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社群福利抽奖 · 结果榜</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="hero">
    <div class="hero-inner">
      
      <h1 class="hero-title" id="resultTitle">社群福利抽奖结果</h1>
      <p class="hero-theme" id="resultTime">—</p>
      <nav class="hero-nav">
        <a href="./index.html" class="hero-link">去抽奖</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 历史记录（共享，所有人可见） -->
    <section class="card panel" id="historyPanel">
      <div class="panel-head">
        <span class="panel-icon">🕘</span>
        <div>
          <h2>抽奖历史</h2>
          <p class="muted">本机浏览器保存的开奖记录；若部署后端则全员共享</p>
        </div>
      </div>
      <div id="historyList" class="history-list"></div>
      <p class="muted small mt" id="historyTip">记录保存在本机浏览器；如需全员共享，请部署后端并访问 /static 版本。</p>
    </section>

    <!-- 当前结果（可编辑） -->
    <section class="card panel">
      <div class="panel-head">
        <span class="panel-icon">🎖️</span>
        <div>
          <h2>本期荣耀榜单</h2>
          <p class="muted">开奖结果展示，仅供查看</p>
        </div>
      </div>

      <div id="resultBody" class="draw-progress">
        <p class="muted">未检测到抽奖数据，请返回抽奖台生成结果链接。</p>
      </div>

      <div class="row center mt">
        <a href="./index.html" class="btn ghost">我也来抽一次</a>
      </div>

      <div class="row center gap mt" id="exportBar" style="display:none;">
        <button class="btn primary" id="exportImgBtn">🖼️ 导出图片</button>
        <button class="btn ghost" id="exportPdfBtn">📄 导出 PDF</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>由 <a href="https://with.woa.com/" style="color: #8A2BE2;" target="_blank">With</a> 通过自然语言生成</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="./result.js"></script>



</body>
</html>
